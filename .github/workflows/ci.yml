# CI/CD pipeline for the Student Record System.
# Runs automatically on every pull request to main and on every push to main.
# Stages (teacher's order): Build -> Test -> Coverage -> Lint -> Format -> Security -> Package
# plus a Frontend job (React) that runs alongside the backend stages.

name: CI/CD pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

defaults:
  run:
    shell: bash # bash with "pipefail", so a failing command inside a pipe fails the step

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------- BUILD
  build:
    name: 1. Build (install backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check the app starts
        run: python -c "from src.app import create_app; create_app(); print('app OK')"

  # ---------------------------------------------------------------- TEST
  test:
    name: 2. Test (unit + integration on MySQL)
    runs-on: ubuntu-latest
    needs: build
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_password
          MYSQL_DATABASE: student_records_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests (in-memory SQLite)
        run: pytest tests/unit -v
      - name: Integration tests (real MySQL)
        env:
          TEST_DATABASE_URL: mysql+pymysql://root:ci_password@127.0.0.1:3306/student_records_test
        run: pytest tests/integration -v --tb=short

  # ---------------------------------------------------------------- COVERAGE
  coverage:
    name: 3. Coverage (must be >= 80%)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests with coverage threshold
        run: pytest tests --cov=src --cov-fail-under=80 --cov-report=term-missing --cov-report=html
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov

  # ---------------------------------------------------------------- LINT
  lint:
    name: 4. Lint (pylint >= 7.0)
    runs-on: ubuntu-latest
    needs: coverage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run pylint and enforce minimum score
        run: pylint src/ --fail-under=7.0 | tee lint_report.txt
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint_report.txt

  # ---------------------------------------------------------------- FORMAT
  format:
    name: 5. Format (black)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check formatting (run "black src tests scripts" locally to fix)
        run: black --check --diff src tests scripts

  # ---------------------------------------------------------------- SECURITY
  security:
    name: 6. Security (bandit)
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Full security report (all severities)
        run: bandit -r src -f json -o security_report.json || true
      - name: Fail on high-severity findings
        run: bandit -r src --severity-level high
      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security_report.json

  # ---------------------------------------------------------------- FRONTEND
  frontend:
    name: Frontend (React) - lint, format, test, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Format check (Prettier)
        run: npm run format:check
      - name: Tests with coverage (must be >= 60%)
        run: npm run coverage
      - name: Security audit (fail on high)
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # ---------------------------------------------------------------- PACKAGE (CD)
  package:
    name: 7. Package (deployment zip)
    runs-on: ubuntu-latest
    needs: [security, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Download reports and frontend build
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create deployment package
        run: |
          zip -r deployment-package.zip src scripts run.py requirements.txt .env.example README.md artifacts
          echo "Package contents:" && unzip -l deployment-package.zip | tail -5
      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deployment-package.zip
