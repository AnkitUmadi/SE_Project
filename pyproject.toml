[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.pylint.main]
init-hook = "import sys; sys.path.insert(0, '.')"

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = ["too-few-public-methods"]

[tool.coverage.run]
source = ["src"]
